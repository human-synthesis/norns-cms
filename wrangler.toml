# Cloudflare Workers config for norns-cms — served at norns-cms.humansynthesis.ai.
#
# Compat flags required by the norns runtime:
#   nodejs_als     → AsyncLocalStorage (per-request DI scope, event.locals.container)
#   nodejs_compat  → general Node compat layer (node:crypto scrypt, node:module)
#
# D1 is bound as `DB`; auth/server/module.c reads it from
# `event.platform.env.DB` and every repo runs on it. Migrations for wrangler
# live in migrations/d1/ (a flat mirror of migrations/<feature>/, kept in
# sync by `bun run d1:sync`) and are applied with `bun run db:migrate`
# (local) / `bun run db:migrate:remote` (production). Under `bun run dev`,
# adapter-cloudflare's platform proxy reads this file and serves a local D1
# from .wrangler/state/.

name = "norns-cms"
main = "worker/index.js"
compatibility_date = "2026-04-01"
compatibility_flags = ["nodejs_als", "nodejs_compat"]

routes = [
	{ pattern = "norns-cms.humansynthesis.ai", custom_domain = true }
]

[assets]
directory = ".svelte-kit/cloudflare"
binding = "ASSETS"

[observability]
enabled = true

# Optional config. Secrets are set with `wrangler secret put <NAME>`, never here:
#   CMS_SECRET      encrypts two-factor secrets at rest (required for 2FA in production)
#   CRON_SECRET     authenticates the daily maintenance cron (worker/index.js → /api/cron)
#   AIOSIS_API_KEY  required: sends mail through Aiosis Emails (scope messages:send) from
#                   signup@, signin@, notification@ and contact@ on MAIL_DOMAIN; without it
#                   mail is refused (only `bun run dev` and tests fall back to the mail log)
#   ANTHROPIC_API_KEY  optional: AI translation
#   TURNSTILE_SITE_KEY / TURNSTILE_SECRET_KEY  Cloudflare Turnstile widget "norns-cms";
#                   these win over the keys in System → Form protection (the on/off
#                   switch stays there). TURNSTILE_ENABLED=false turns Turnstile off everywhere.
[vars]
CMS_PUBLIC_URL = "https://norns-cms.humansynthesis.ai"
# Sender domain set up in Aiosis Emails (Settings → Email → Mail domain wins).
MAIL_DOMAIN = "aiosis.com"

# Daily housekeeping: expired sessions and links, retention purges.
[triggers]
crons = ["17 3 * * *"]

# Media library (media/server/storage.js). Locally, `bun run dev` gets an
# emulated bucket under .wrangler/state through the platform proxy.
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "norns-cms-media"

[[d1_databases]]
binding = "DB"
database_name = "norns-cms"
database_id = "1c69b792-cc7c-4126-a1c3-51e38fb375a0"
migrations_dir = "migrations/d1"
