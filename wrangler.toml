# Cloudflare Workers config for norns-cms — served at norns-cms.humansynthesis.ai.
#
# Compat flags required by the norns runtime:
#   nodejs_als     → AsyncLocalStorage (per-request DI scope, event.locals.container)
#   nodejs_compat  → general Node compat layer (node:crypto scrypt, node:module)
#
# D1 is bound as `DB`; auth/server/module.c reads it from
# `event.platform.env.DB` and every repo runs on it. Migrations for wrangler
# live in migrations/d1/ (a flat mirror of migrations/<feature>/, kept in
# sync by `bun run d1:sync`) and are applied with `bun run db:migrate`
# (local) / `bun run db:migrate:remote` (production). Under `bun run dev`,
# adapter-cloudflare's platform proxy reads this file and serves a local D1
# from .wrangler/state/.

name = "norns-cms"
main = ".svelte-kit/cloudflare/_worker.js"
compatibility_date = "2026-04-01"
compatibility_flags = ["nodejs_als", "nodejs_compat"]

routes = [
	{ pattern = "norns-cms.humansynthesis.ai", custom_domain = true }
]

[assets]
directory = ".svelte-kit/cloudflare"
binding = "ASSETS"

[observability]
enabled = true

[vars]
CMS_SITE_TITLE = "Norns CMS"
CMS_SITE_TAGLINE = "A content management system that is an ordinary Norns app."

[[d1_databases]]
binding = "DB"
database_name = "norns-cms"
# Replace with the id printed by `wrangler d1 create norns-cms` before the
# first production deploy. Any value works for --local.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations/d1"
